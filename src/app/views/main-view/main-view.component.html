<div class="container flex flex-col py-2">
  <div class="d-flex align-items-center">
    <h2 class="typo-text-primary header">
      {{ "GOOD_MORNING" | translate | titlecase }}
    </h2>
    <img
      src="assets/logo.png"
      [style.height]="'40px'"
      alt="Fix & Patch logo"
      loading="lazy"
    />
  </div>
  <span class="typo-text-secondary">{{ "TODAY" | translate }}</span>

  <div ngbAccordion class="mt-3">
    <div ngbAccordionItem class="p-2 border-0">
      <div ngbAccordionHeader>
        <button ngbAccordionButton class="btn btn-primary mb-2 fw-500">
          {{ "FIND_YOUR_LOCATION" | translate }}
        </button>
      </div>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="p-0">
          <ng-template>
            <div class="shadow-lg rounded">
              <app-map [location]="locationData()?.weather?.coord"></app-map>
              <app-input-form
                [inputForm]="inputForm"
                (onShowData)="onSelectedLocation($event)"
              ></app-input-form>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
